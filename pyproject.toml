[project]
name = "qcyctl"
version = "0.1.1"
description = "Controle do fone QCY HT05 (MeloBuds ANC) para Linux e Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Henrique (@pedrohrqe)" }]
keywords = ["qcy", "ht05", "melobuds", "bluetooth", "earbuds", "anc", "linux"]
requires-python = ">=3.11"
dependencies = ["bleak>=0.22", "PySide6>=6.7", "qasync>=0.27"]

[project.urls]
Homepage = "https://github.com/pedrohrqe/melobuds"
Issues = "https://github.com/pedrohrqe/melobuds/issues"
Changelog = "https://github.com/pedrohrqe/melobuds/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dualboot = ["python-registry>=1.3"]
dev = ["pyinstaller>=6", "pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
qcyctl = "qcyctl.cli:main"

[project.gui-scripts]
qcyctl-gui = "qcyctl.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcyctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
