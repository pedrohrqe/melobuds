[package]
name = "melobuds"
version = "0.2.0"
edition = "2021"
description = "Controle não oficial do fone QCY HT05 (MeloBuds ANC) para Linux e Windows"
license = "MIT"
repository = "https://github.com/pedrohrqe/melobuds"
authors = ["Pedro Henrique (@pedrohrqe)"]
default-run = "qcyctl-gui"

[lib]
name = "melobuds"
path = "src/lib.rs"

[[bin]]
name = "qcyctl-gui"
path = "src/main.rs"

[[bin]]
name = "qcyctl"
path = "src/bin/qcyctl.rs"

[dependencies]
slint = { version = "1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "signal"] }
btleplug = "0.11"
futures = "0.3"
uuid = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }
dbus-tokio = "0.7"
ksni = "0.3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.55"

[build-dependencies]
slint-build = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Só para gravar PNGs em examples/shot.rs (verificação visual da interface).
image = { version = "0.25", default-features = false, features = ["png"] }
