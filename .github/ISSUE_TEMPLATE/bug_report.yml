name: Relato de bug
description: O app não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra o app.
        2. Tire os fones da caixa.
        3. ...
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operacional
      placeholder: Fedora 44, Ubuntu 24.04, Windows 11...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do app e tipo de instalação
      placeholder: 0.2.0, RPM
    validations:
      required: true
  - type: input
    id: fone
    attributes:
      label: Modelo do fone e firmware
      placeholder: QCY HT05, firmware 4.0.0
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Execute `qcyctl-gui --debug` e cole as linhas do momento da falha. Remova os endereços Bluetooth que você não quer publicar.
      render: text
