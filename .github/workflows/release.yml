name: release

# Uma tag v* gera os instaladores e publica o release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04: o binário roda em sistemas com glibc 2.35 ou mais recente.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Ferramentas de empacotamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libfontconfig1-dev pkg-config
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Gera RPM, DEB e AppImage
        run: packaging/linux/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/packages/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Gera os executáveis
        run: cargo build --release --locked --bin qcyctl-gui --bin qcyctl
      - name: Gera o instalador e o pacote portátil
        shell: pwsh
        run: |
          $versao = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force dist/qcyctl, dist/packages | Out-Null
          Copy-Item target/release/qcyctl-gui.exe, target/release/qcyctl.exe, packaging/icons/qcyctl.ico, LICENSE, THIRD_PARTY_NOTICES.md dist/qcyctl/
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DAppVersion=$versao" packaging/windows/melobuds.iss
          Compress-Archive -Path dist/qcyctl/* -DestinationPath "dist/packages/qcyctl-$versao-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/packages/*
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Somas de verificação
        run: cd pacotes && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
