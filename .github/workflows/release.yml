name: release

# Uma tag v* gera os instaladores e publica o release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Ferramentas de empacotamento
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxkbcommon-x11-0
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Instala o projeto
        run: pip install -q ".[dualboot]" pyinstaller
      - name: Gera RPM, DEB e AppImage
        run: PYTHON=python packaging/linux/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/packages/*
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instala o projeto
        run: pip install -q ".[dualboot]" pyinstaller
      - name: Gera os executáveis
        run: python -m PyInstaller --noconfirm --log-level WARN packaging/qcyctl.spec
      - name: Gera o instalador e o pacote portátil
        shell: pwsh
        run: |
          $versao = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress | Out-Null }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          New-Item -ItemType Directory -Force dist/packages | Out-Null
          & $iscc /Q "/DAppVersion=$versao" packaging/windows/melobuds.iss
          Compress-Archive -Path dist/qcyctl/* -DestinationPath "dist/packages/qcyctl-$versao-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/packages/*
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true
      - name: Somas de verificação
        run: cd pacotes && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: pacotes/*
          generate_release_notes: true
