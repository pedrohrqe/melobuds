name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bibliotecas do sistema para o Qt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instala o projeto
        run: pip install -q -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
